[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "coach"
version = "1.0.0"
description = "Subsystem 3 of the waste sorting assistant: AI coach and analytics"
requires-python = ">=3.10"
dependencies = [
    "openai>=1.40",
    "pandas>=2.2",
    "numpy>=1.26",
    "plotly>=5.22",
]

[project.optional-dependencies]
test = ["pytest>=8.0", "SQLAlchemy>=2.0"]

[tool.setuptools.packages.find]
where = ["src"]
